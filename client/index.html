<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WayMate — Plan smarter journeys</title>
    <meta name="description" content="WayMate is an AI-powered travel companion that helps you plan, track, and adapt journeys with local intelligence." />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />

    <!-- ── Font performance: preconnect eliminates DNS + TLS latency ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Non-blocking font load (display=swap).
      Playfair Display: display/editorial headings.
      Inter: all UI text, labels, body copy.
      Replaces the @import rules that were scattered across App.css,
      index.css, and Home.css — those have been removed.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap"
    />

    <!--
      Critical CSS — inlined so the browser can paint the loading state
      before ANY JavaScript or external CSS downloads.
      This prevents the flash of unstyled content (FOUC) and provides
      the app-loader spinner immediately on page load.
    -->
    <style>
      /* Box model reset */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* Base */
      html {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background-color: #f8f5ee;
        color: #173328;
        min-height: 100vh;
      }

      #root {
        min-height: 100vh;
        isolation: isolate;
      }

      /* ── App loader — renders before React JS executes ─────────────── */
      /* Removed by main.jsx on first mount via removeAppLoader()        */
      #app-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f8f5ee;
        z-index: 9999;
      }

      /* Compass ring spinner — matches Rule 4 brand motif */
      .app-loader-compass {
        position: relative;
        width: 48px;
        height: 48px;
      }

      .app-loader-compass__outer {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid #d7bc9c;
        border-top-color: #173328;
        animation: compass-spin 1s linear infinite;
      }

      .app-loader-compass__inner {
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        border: 1.5px solid rgba(23, 51, 40, 0.12);
        border-bottom-color: #2a5a46;
        animation: compass-spin 0.7s linear infinite reverse;
      }

      /* Needle — a tiny vertical line at center, rotates with outer ring */
      .app-loader-compass__needle {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1.5px;
        height: 14px;
        background: linear-gradient(to bottom, #173328 50%, rgba(23,51,40,0.25) 50%);
        transform: translate(-50%, -100%) rotate(0deg);
        transform-origin: bottom center;
        animation: compass-spin 1s linear infinite;
        border-radius: 1px;
      }

      @keyframes compass-spin {
        to { transform-origin: center; transform: rotate(360deg); }
      }

      /* Fix needle transform-origin conflict with keyframes */
      .app-loader-compass__needle {
        top: 50%;
        left: 50%;
        transform: translateX(-50%) translateY(-100%);
        transform-origin: 50% 100%;
        animation: needle-spin 1s linear infinite;
      }

      @keyframes needle-spin {
        to { transform: translateX(-50%) translateY(-100%) rotate(360deg); }
      }

      /* ── Page skeleton (used by lazy route Suspense boundaries) ─────── */
      .page-skeleton {
        min-height: 100vh;
        background: #f8f5ee;
      }

      .page-skeleton__nav {
        height: 64px;
        background: #ffffff;
        border-bottom: 1px solid rgba(23, 51, 40, 0.08);
      }

      .page-skeleton__body {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .page-skeleton__block {
        border-radius: 10px;
        background: linear-gradient(
          90deg,
          #ede8df 25%,
          #e4ddd3 50%,
          #ede8df 75%
        );
        background-size: 400% 100%;
        animation: skeleton-shimmer 1.4s ease infinite;
      }

      .page-skeleton__block--hero {
        height: 280px;
        border-radius: 16px;
      }

      .page-skeleton__block--wide {
        height: 48px;
        width: 60%;
      }

      .page-skeleton__block--half {
        height: 120px;
      }

      @keyframes skeleton-shimmer {
        0%   { background-position: 100% 0; }
        100% { background-position: -100% 0; }
      }

      /* ── Reduced motion: collapse all animation durations ───────────── */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Static loader — visible before React mounts, removed by main.jsx -->
    <div id="app-loader" aria-label="Loading WayMate…" role="status">
      <div class="app-loader-compass">
        <div class="app-loader-compass__outer"></div>
        <div class="app-loader-compass__inner"></div>
        <div class="app-loader-compass__needle"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
