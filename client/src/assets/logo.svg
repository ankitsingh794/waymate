<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 32" fill="none" role="img" aria-label="WayMate">
  <!-- Compass glyph: outer ring -->
  <circle cx="16" cy="16" r="10" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Compass glyph: inner tick marks -->
  <line x1="16" y1="6" x2="16" y2="9"  stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="23" x2="16" y2="26" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6"  y1="16" x2="9"  y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="16" x2="26" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Compass needle: north (filled/dark) -->
  <polygon points="16,8 14,18 16,16 18,18" fill="currentColor"/>
  <!-- Compass needle: south (outlined/light) -->
  <polygon points="16,24 14,14 16,16 18,14" fill="currentColor" opacity="0.35"/>
  <!-- Centre dot -->
  <circle cx="16" cy="16" r="1.5" fill="currentColor"/>
  <!-- Wordmark: "WayMate" -->
  <text
    x="34"
    y="21"
    font-family="'Playfair Display', Georgia, serif"
    font-size="14"
    font-weight="700"
    letter-spacing="-0.01em"
    fill="currentColor"
  >WayMate</text>
</svg>
